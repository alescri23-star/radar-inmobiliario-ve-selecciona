<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mapa territorial · Radar Venezuela</title><script src="/theme-init.js?v=1"></script>
  <link rel="stylesheet" href="/style.css?v=coverage1"><link rel="stylesheet" href="/coverage.css?v=coverage2"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9coqIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script><script defer src="/coverage.js?v=coverage1"></script><link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1">
</head>
<body class="portal coverage-page">
  <header class="public-header"><a href="/" class="public-brand coverage-brand"><img src="/logo-radar.svg" alt="Radar Venezuela"><span class="public-space-label">Cobertura territorial</span></a><nav class="public-menu" aria-label="Navegación privada"><a class="coverage-nav-link" href="/">Laboratorio</a><a class="coverage-nav-link" href="/admin">Ir a gestión</a><button id="themeToggle" type="button" aria-pressed="false">Modo oscuro</button><button id="account" type="button">Cerrar sesión</button></nav></header>
  <main class="coverage-map-main">
    <section class="national-map-shell" aria-label="Cobertura inmobiliaria de Venezuela">
      <div id="coverageMap" aria-label="Mapa interactivo de Venezuela con estados y anuncios"></div>
      <aside class="map-summary" aria-live="polite"><p class="eyebrow">COBERTURA TERRITORIAL</p><h1>Venezuela</h1><p id="coverageMessage">Cargando estados y anuncios…</p><div class="map-summary-stats"><span><i class="sale-dot"></i><b id="saleCount">—</b> venta</span><span><i class="rent-dot"></i><b id="rentCount">—</b> alquiler</span></div><small>Pasa el cursor por un estado. Pulsa un anuncio para abrir su ficha.</small></aside>
      <div class="map-status"><strong id="locatedCount">—</strong><span>anuncios visibles</span><small id="missingCount">— sin coordenadas</small></div>
      <div class="coverage-legend" aria-label="Leyenda"><span><i class="state-swatch"></i>Estado</span><span><i class="sale-dot"></i>Venta</span><span><i class="rent-dot"></i>Alquiler</span></div>
    </section>
  </main>
</body></html>
